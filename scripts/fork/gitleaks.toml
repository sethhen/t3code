# Secret scan for the fork (public repo). gitleaks' default rules plus rules for the login
# tokens a proxy pool handles (Claude/Codex OAuth, CLIProxyAPI auth files).
# Run: scripts/fork/secret-scan.sh (update.sh runs it before pushing; CI before publishing).

[extend]
useDefault = true

[[rules]]
id = "oauth-token-json"
description = "OAuth token stored in a JSON/YAML/TOML field"
regex = '''(?i)["']?(?:access|refresh|id|session)_?token["']?\s*[:=]\s*["']([A-Za-z0-9._~+/=-]{24,})["']'''
secretGroup = 1
entropy = 3.5
keywords = ["token"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth token (sk-ant-oat / sk-ant-ort)"
regex = '''sk-ant-o[ar]t\d{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-o"]

[[rules]]
id = "proxy-api-key-config"
description = "api-keys entry in a CLIProxyAPI config"
regex = '''(?i)api-keys\s*:\s*\n\s*-\s*["']?([A-Za-z0-9._-]{16,})'''
secretGroup = 1
keywords = ["api-keys"]

[allowlist]
description = "Public values and test fixtures"
# T3 Connect's public build config: shipped in every T3 Code app, stored as public variables upstream.
regexes = ['''pk_live_Y2xlcmsudDMuY29kZXMk''', '''hzxSgY2cH10sDU2r''']
paths = ['''(^|/)\.repos/''']
